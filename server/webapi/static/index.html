<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de transmisión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Raspi Streaming</h1>

    <section id="login-view">
      <div class="form-container">
        <p>Login</p>
        <form id="login-form" class="form">
          <label for="username">Usuario</label>
          <input type="text" id="username" class="input" placeholder="Ingresa tu usuario" autocomplete="username" required>

          <label for="password">Password</label>
          <input type="password" id="password" class="input" placeholder="Password" autocomplete="current-password" required>

          <button type="submit">Submit</button>
          <p id="login-error" class="error" hidden></p>
        </form>
      </div>
    </section>

    <section id="dashboard-view" hidden>
      <div class="topbar">
        <span id="session-info"></span>
        <button id="logout-btn" class="link">Salir</button>
      </div>

      <!-- Tarjeta de stream -->
      <div id="services"></div>

      <!-- Configuración de overlay — visible cuando el toggle "Con overlay" está ON -->
      <div id="overlay-config" hidden>
        <h3>Configuración de overlay</h3>

        <!-- Logo -->
        <p class="section-label">Logo PNG (opcional)</p>
        <div class="logo-path-row">
          <input type="text" id="cfg-overlay-logo-file" placeholder="/var/lib/raspi-streaming/assets/logos/logo.png" autocomplete="off">
          <label class="btn-upload" for="logo-file-input" title="Subir archivo">&#128194;</label>
          <input type="file" id="logo-file-input" accept=".png,.jpg,.jpeg" style="display:none">
        </div>
        <p id="logo-upload-msg" class="section-label" hidden></p>
        <div class="grid2" style="margin-top:10px">
          <label>
            Posición
            <select id="cfg-overlay-logo-pos">
              <option value="br">Abajo derecha</option>
              <option value="bl">Abajo izquierda</option>
              <option value="tr">Arriba derecha</option>
              <option value="tl">Arriba izquierda</option>
            </select>
          </label>
          <label>
            Margen (px)
            <input type="number" id="cfg-overlay-logo-pad" min="0" max="200" value="20">
          </label>
          <label>
            Ancho px (0 = original)
            <input type="number" id="cfg-overlay-logo-w" min="0" max="500" value="0">
          </label>
        </div>

        <!-- Texto -->
        <p class="section-label" style="margin-top:14px">Texto en pantalla (opcional)</p>
        <label>
          <input type="text" id="cfg-overlay-text" placeholder="Ej: Cámara 1 — Entrada Principal" maxlength="200">
        </label>
        <label>
          Posición del texto
          <select id="cfg-overlay-text-pos">
            <option value="tl">Arriba izquierda</option>
            <option value="tr">Arriba derecha</option>
            <option value="bl">Abajo izquierda (default)</option>
            <option value="br">Abajo derecha</option>
            <option value="center">Centro</option>
          </select>
        </label>
        <div class="toggle-row">
          <span>Mostrar hora en tiempo real</span>
          <label class="toggle-switch">
            <input type="checkbox" id="cfg-overlay-timestamp">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <button id="save-overlay-btn">Guardar configuración overlay</button>
        <p id="overlay-msg" hidden></p>
      </div>

      <!-- Configuración general -->
      <section id="config-section" hidden>
        <h2>Configuración</h2>
        <form id="config-form">

          <!-- Dispositivos -->
          <div class="devices-header">
            <p class="section-label">Cámara</p>
            <button type="button" id="btn-scan-devices" class="btn-scan">Escanear</button>
          </div>
          <div id="device-status" class="device-status"></div>
          <select id="cfg-video-device">
            <option value="" data-fixed="1">Auto-detectar</option>
          </select>

          <p class="section-label" style="margin-top:14px">Micrófono</p>
          <select id="cfg-audio-device">
            <option value="" data-fixed="1">Auto-detectar</option>
            <option value="__none__" data-fixed="1">Sin audio (silencio AAC)</option>
          </select>
          <div class="grid2" style="margin-top:10px">
            <div class="toggle-row" style="margin:0">
              <span>Stereo (2 canales)</span>
              <label class="toggle-switch">
                <input type="checkbox" id="cfg-audio-stereo">
                <span class="toggle-slider"></span>
              </label>
            </div>
            <label>
              Frecuencia
              <select id="cfg-audio-rate">
                <option value="44100">44100 Hz</option>
                <option value="48000">48000 Hz</option>
              </select>
            </label>
          </div>

          <!-- Plataforma y destino -->
          <p class="section-label" style="margin-top:14px">Plataforma</p>
          <select id="cfg-platform">
            <option value="youtube">YouTube Live</option>
            <option value="facebook">Facebook / Meta Live</option>
            <option value="custom">URL personalizada</option>
          </select>

          <label id="cfg-stream-key-row" style="margin-top:10px">
            Stream Key
            <input type="password" id="cfg-stream-key" placeholder="xxxx-xxxx-xxxx-xxxx" autocomplete="off">
          </label>

          <label id="cfg-rtmp-url-row" style="margin-top:10px" hidden>
            URL RTMP personalizada
            <input type="text" id="cfg-rtmp-url" placeholder="rtmp://..." autocomplete="off">
          </label>

          <!-- Resolución -->
          <p class="section-label" style="margin-top:14px">Resolución</p>
          <div class="preset-bar">
            <button type="button" data-preset="360p">360p</button>
            <button type="button" data-preset="480p">480p</button>
            <button type="button" data-preset="720p">720p</button>
            <button type="button" data-preset="1080p">1080p</button>
          </div>

          <input type="hidden" id="cfg-width">
          <input type="hidden" id="cfg-height">
          <input type="hidden" id="cfg-fps">
          <input type="hidden" id="cfg-bitrate">

          <details id="cfg-advanced">
            <summary>Personalizado</summary>
            <div class="grid2" style="margin-top:12px">
              <label>Ancho (px)    <input type="number" id="cfg-width-vis"   min="320"    max="1920"></label>
              <label>Alto (px)     <input type="number" id="cfg-height-vis"  min="240"    max="1080"></label>
              <label>FPS           <input type="number" id="cfg-fps-vis"     min="1"      max="60"></label>
              <label>Bitrate (bps) <input type="number" id="cfg-bitrate-vis" min="200000" max="25000000"></label>
            </div>
            <label>
              Preset de codificación
              <select id="cfg-preset">
                <option value="ultrafast">ultrafast — máxima velocidad, menor calidad</option>
                <option value="superfast">superfast</option>
                <option value="veryfast">veryfast — recomendado Pi 3B</option>
                <option value="faster">faster</option>
                <option value="fast">fast — mejor calidad, más CPU</option>
              </select>
            </label>
          </details>

          <button type="submit">Guardar configuración</button>
          <p id="config-msg" hidden></p>
        </form>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
