name: Build and Deploy Streaming API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/api/**"
      - "charts/streaming-api/**"
      - ".github/workflows/streaming-api.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: raspi-streaming-api
      IMAGE_TAG: ${{ github.sha }}
      K3S_NAMESPACE: mvps
      RELEASE_NAME: streaming-api
      CHART_PATH: ./charts/streaming-api
      SERVER_K3S: ${{ vars.SERVER_K3S }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend/api
          file: backend/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_DATA }}" ]; then
            echo "::error::Missing required secret: KUBE_CONFIG_DATA"
            echo "Create it in GitHub repo settings with base64-encoded kubeconfig"
            exit 1
          fi
          if [ -z "$SERVER_K3S" ]; then
            echo "::error::Missing required variable: SERVER_K3S"
            echo "Create it in GitHub repo variables. Example: 158.69.246.55"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          SERVER="$SERVER_K3S"
          if ! echo "$SERVER" | grep -q '^https\?://'; then
            SERVER="https://${SERVER}:6443"
          fi
          CONTEXT="$(kubectl config current-context)"
          CLUSTER="$(kubectl config view -o jsonpath="{.contexts[?(@.name==\"${CONTEXT}\")].context.cluster}")"
          kubectl config set-cluster "$CLUSTER" \
            --server="$SERVER" \
            --insecure-skip-tls-verify=true

          kubectl cluster-info
          kubectl auth can-i get pods --all-namespaces

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1

      - name: Ensure namespace exists
        run: |
          kubectl get namespace "$K3S_NAMESPACE" >/dev/null 2>&1 \
            || kubectl create namespace "$K3S_NAMESPACE"

      - name: Upsert API tokens in k3s
        env:
          STREAMING_API_RASPI_TOKEN: ${{ secrets.STREAMING_API_RASPI_TOKEN }}
          STREAMING_API_ADMIN_TOKEN: ${{ secrets.STREAMING_API_ADMIN_TOKEN }}
        run: |
          if [ -z "$STREAMING_API_RASPI_TOKEN" ]; then
            echo "::error::Missing required secret: STREAMING_API_RASPI_TOKEN"
            exit 1
          fi
          if [ -z "$STREAMING_API_ADMIN_TOKEN" ]; then
            echo "::error::Missing required secret: STREAMING_API_ADMIN_TOKEN"
            exit 1
          fi
          kubectl -n "$K3S_NAMESPACE" create secret generic streaming-api-secrets \
            --from-literal=API_TOKEN_RASPI="$STREAMING_API_RASPI_TOKEN" \
            --from-literal=API_TOKEN_ADMIN="$STREAMING_API_ADMIN_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Upsert mTLS client CA in k3s
        env:
          STREAMING_API_CLIENT_CA_CRT_B64: ${{ secrets.STREAMING_API_CLIENT_CA_CRT_B64 }}
        run: |
          if [ -z "$STREAMING_API_CLIENT_CA_CRT_B64" ]; then
            echo "::error::Missing required secret: STREAMING_API_CLIENT_CA_CRT_B64"
            exit 1
          fi
          printf '%s' "$STREAMING_API_CLIENT_CA_CRT_B64" \
            | base64 --decode > /tmp/streaming-api-client-ca.crt
          kubectl -n "$K3S_NAMESPACE" create secret generic streaming-api-client-ca \
            --from-file=ca.crt=/tmp/streaming-api-client-ca.crt \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/streaming-api-client-ca.crt

      - name: Lint chart
        run: |
          helm lint "$CHART_PATH"

      - name: Deploy Helm release
        run: |
          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$K3S_NAMESPACE" \
            --set image.repository="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" \
            --set image.tag="$IMAGE_TAG" \
            --set env.PUBLIC_BASE_URL="https://streaming.rafex.io" \
            --wait --timeout 5m
