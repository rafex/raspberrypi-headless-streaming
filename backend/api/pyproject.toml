[project]
name = "raspi-streaming-api"
version = "0.1.0"
description = "Backend publico para salud y control remoto de Raspberry Pi streaming."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
]

[project.scripts]
streaming-api = "streaming_api.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0,<0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streaming_api"]
